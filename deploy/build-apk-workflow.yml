name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      note:
        description: "Заметка к сборке"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: |
          set -e
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleDebug --no-daemon --stacktrace
          else
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
            unzip -q gradle.zip
            ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          release_name: Mavis Demo ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: "APK собран автоматически в GitHub Actions. Скачай файл и установи на телефон."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
